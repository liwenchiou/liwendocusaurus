server {
    listen 80;
    server_name localhost;

    # 1. 備用諮詢台 (最低優先級)
    location / {
        return 200 "Hello, this is / (General Desk)";
    }

    # 2. 快速道路 (中優先級)
    location ^~ /test/ {
        return 200 "Hello, this is ^~/test/ (Express Way)";
    }

    # 3. VIP 直達專線 (最高優先級)
    location = /test {
        return 200 "Hello, this is =/test (VIP Line)";
    }
}
